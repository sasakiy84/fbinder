<!DOCTYPE html>
<!-- Template for generated static HTML pages. Placeholders are substituted by main.py. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$document_title</title>
<link rel="stylesheet" href="$style_href">
<script src="$script_href" defer></script>
</head>
<body>
<header>
<nav aria-label="Site">
<ul>
<li><a href="$home_href">Home</a></li>
$error_link_html
</ul>
</nav>
</header>
<main>
<h1>$page_title</h1>
$page_meta_html
<search class="site-search" data-search-index="$search_index_href">
<form class="site-search-form" method="get">
<label for="site-search-input">検索</label>
<div class="site-search-controls">
<input id="site-search-input" name="q" type="search" autocomplete="off">
<button type="submit">検索</button>
</div>
</form>
<p id="site-search-status" class="search-status" aria-live="polite"></p>
<ul id="site-search-results" class="search-results"></ul>
<nav id="site-search-pagination" class="search-pagination" aria-label="検索結果ページ"></nav>
</search>
<div id="content-body" class="content-body">
$body_html
</div>
</main>
</body>
</html>
